<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b56576"/><stop offset="1" stop-color="#93485b"/>
    </linearGradient>
    <filter id="hand" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="7"/>
    </filter>
  </defs>
  <rect x="20" y="20" width="472" height="472" rx="118" fill="url(#g)"/>
  <g fill="none" stroke="#fdfcf9" stroke-linecap="round" stroke-linejoin="round" filter="url(#hand)">
    <!-- D -->
    <path d="M150 138 C147 200 151 268 149 334" stroke-width="34"/>
    <path d="M146 140 C262 122 318 196 306 252 C296 306 236 338 152 332" stroke-width="34"/>
    <!-- j: haste que vira sorriso -->
    <path d="M372 196 C374 250 373 300 368 344 C356 420 240 450 150 400 C140 394 133 386 130 376" stroke-width="34"/>
    <!-- traço de rascunho por cima, como lápis -->
    <path d="M140 130 C258 112 326 190 314 252" stroke-width="5" opacity=".45"/>
    <path d="M380 204 C383 300 380 360 352 392" stroke-width="5" opacity=".45"/>
  </g>
  <g fill="#fdfcf9" filter="url(#hand)">
    <circle cx="376" cy="136" r="24"/>            <!-- pingo do j (olho) -->
    <circle cx="214" cy="226" r="20"/>            <!-- olho dentro do D -->
  </g>
  <g transform="translate(318 318)">
    <path d="M86 6 L150 30 C150 96 128 140 86 164 C44 140 22 96 22 30 Z" fill="#fdfcf9" stroke="#93485b" stroke-width="12" stroke-linejoin="round"/>
    <path d="M56 86 L80 110 L120 62" fill="none" stroke="#93485b" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
