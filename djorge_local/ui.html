:root{
  --bg:#f6f3ee;--bg2:#efe9e0;--surface:#fdfcf9;
  --ink:#26221e;--ink2:#5f584f;--ink3:#968d81;
  --rose:#b56576;--rose-deep:#93485b;--rose-soft:#f5e5e9;--rose-glow:rgba(181,101,118,.16);
  --line:rgba(38,34,30,.10);--line2:rgba(38,34,30,.06);
  --sh1:0 10px 30px rgba(38,34,30,.07);--sh2:0 26px 60px rgba(38,34,30,.12);
  --serif:'Fraunces',Georgia,serif;--sans:'Manrope',system-ui,sans-serif;--mono:'Geist Mono',ui-monospace,'Cascadia Code',monospace;
  --r-lg:28px;--r-md:20px;--r-sm:14px;--ease:cubic-bezier(.22,.61,.21,1)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--sans);color:var(--ink);line-height:1.6;background:var(--bg);min-height:100vh;overflow-x:hidden;
  background-image:radial-gradient(900px 500px at 90% -6%,var(--rose-glow),transparent 60%),
                   radial-gradient(800px 480px at -10% 40%,rgba(239,233,224,.9),transparent 62%)}
::selection{background:var(--rose);color:#fff}
.grain{position:fixed;inset:0;z-index:90;pointer-events:none;opacity:.22;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/><feComponentTransfer><feFuncA type='linear' slope='0.3'/></feComponentTransfer></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
code{font-family:var(--mono);font-size:.88em;background:var(--rose-soft);color:var(--rose-deep);padding:1px 6px;border-radius:6px}
/* nav */
.navpill{position:sticky;top:14px;z-index:110;margin:14px auto 0;width:min(1180px,calc(100% - 24px));display:flex;align-items:center;gap:14px;
  padding:10px 12px 10px 24px;border-radius:999px;border:1px solid var(--line);background:rgba(253,252,249,.78);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:var(--sh1);flex-wrap:wrap}
.brand{font-family:var(--serif);font-weight:700;font-size:19px;white-space:nowrap}
.brand em{font-style:italic;color:var(--rose-deep)}
.brand{display:flex;align-items:center;gap:10px}.logo{width:34px;height:34px;flex:none;transition:transform .5s var(--ease)}.brand:hover .logo{transform:rotate(-8deg) scale(1.06)}
.logo.big{width:110px;height:110px;animation:bob 2.4s ease-in-out infinite}@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-8px) rotate(3deg)}}
.navlinks{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.navlinks button{font:600 13px var(--sans);color:var(--ink2);background:none;border:0;padding:9px 14px;border-radius:999px;cursor:pointer;
  transition:background .3s var(--ease),color .3s var(--ease)}
.navlinks button:hover{background:var(--rose-soft);color:var(--rose-deep)}
.navlinks button.on{background:linear-gradient(135deg,var(--rose),var(--rose-deep));color:#fff;box-shadow:0 8px 20px var(--rose-glow)}
.live{display:flex;align-items:center;gap:8px;font:600 10px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ink3)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--ink3)}
.live.ok i{background:var(--rose);box-shadow:0 0 0 4px var(--rose-glow);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.75}50%{transform:scale(1.15);opacity:1}}
/* layout */
main{width:min(1180px,calc(100% - 32px));margin:0 auto;padding:46px 0 90px}
.kicker{font:600 11px var(--mono);letter-spacing:.4em;text-transform:uppercase;color:var(--rose-deep)}
h1{font-family:var(--serif);font-weight:600;font-size:clamp(30px,4.2vw,52px);line-height:1.08;letter-spacing:-.015em;margin:.35em 0 .3em}
h1 .it{font-style:italic;color:var(--rose-deep)}
.lede{color:var(--ink2);max-width:760px;margin-bottom:30px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:22px}
.card{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-lg);padding:24px 24px 26px;box-shadow:var(--sh1);
  transition:transform .4s var(--ease),box-shadow .4s var(--ease),border-color .4s;animation:fadein .5s var(--ease) both}
.card:hover{box-shadow:var(--sh2)}
@keyframes fadein{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card h3{font-family:var(--serif);font-weight:600;font-size:20px;line-height:1.2;margin-bottom:6px}
.meta{font:600 10px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--ink3)}
.text{color:var(--ink2);font-size:14.5px;margin:10px 0 4px;white-space:pre-wrap;word-break:break-word}
.chip{display:inline-block;font:600 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;padding:7px 13px;border-radius:999px;
  border:1px solid var(--line);background:var(--surface);color:var(--ink2);margin:3px 4px 3px 0}
.chip.p{background:linear-gradient(135deg,var(--rose),var(--rose-deep));color:#fff;border-color:transparent;box-shadow:0 8px 20px var(--rose-glow)}
.chip.soft{background:var(--bg2);border-color:transparent}
/* trilha de decisões */
.trail{list-style:none;margin-top:14px;border-top:1px dashed var(--line);padding-top:10px}
.trail li{position:relative;padding:9px 0 9px 34px;font-size:14.5px;color:var(--ink2);border-bottom:1px dashed var(--line)}
.trail li:last-child{border-bottom:0}
.trail li::before{content:"✳";position:absolute;left:6px;top:9px;color:var(--rose)}
.trail li.act::before{content:"→";color:var(--rose-deep);font-weight:700}
.trail b{color:var(--ink);font-family:var(--serif);font-weight:600}
.p{font:600 11px var(--mono);color:var(--rose-deep)}
/* formulários */
label{display:block;font:600 10px var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--ink3);margin:14px 0 6px}
input,textarea,select{width:100%;font:14px var(--sans);color:var(--ink);background:var(--bg);border:1px solid var(--line);
  border-radius:var(--r-sm);padding:12px 14px;outline:none;transition:border-color .3s,box-shadow .3s}
textarea{font-family:var(--mono);font-size:13px;line-height:1.6}
input:focus,textarea:focus,select:focus{border-color:var(--rose);box-shadow:0 0 0 4px var(--rose-glow)}
.btn{display:inline-flex;align-items:center;gap:8px;font:700 13.5px var(--sans);padding:12px 24px;border-radius:999px;border:1px solid transparent;
  cursor:pointer;margin-top:16px;transition:transform .35s var(--ease),box-shadow .35s var(--ease)}
.btn-rose{background:linear-gradient(135deg,var(--rose),var(--rose-deep));color:#fff;box-shadow:0 12px 26px var(--rose-glow)}
.btn-rose:hover{transform:translateY(-3px);box-shadow:0 18px 36px rgba(181,101,118,.3)}
.btn-ghost{background:var(--surface);color:var(--ink);border-color:var(--line);box-shadow:var(--sh1)}
.btn-ghost:hover{transform:translateY(-3px);border-color:var(--rose);color:var(--rose-deep)}
pre{border-radius:var(--r-md);background:#241f1b;color:#efe9e2;box-shadow:var(--sh2);padding:22px;overflow:auto;
  font:12.5px/1.75 var(--mono);margin-top:16px;max-height:560px;white-space:pre-wrap;word-break:break-word}
.empty{font:600 11px var(--mono);letter-spacing:.3em;text-transform:uppercase;color:var(--ink3);text-align:center;padding:60px 0}
/* estado */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:20px;margin-bottom:26px}
.stat{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-lg);padding:24px 18px;text-align:center;box-shadow:var(--sh1)}
.stat .big{font-family:var(--serif);font-weight:600;font-size:clamp(28px,3vw,42px);color:var(--rose-deep);line-height:1}
.stat .cap{font:600 10px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--ink3);margin-top:10px}
table{width:100%;border-collapse:collapse}
th{font:600 10px var(--mono);letter-spacing:.2em;text-transform:uppercase;text-align:left;padding:14px 18px;background:var(--bg2);color:var(--ink2)}
td{padding:14px 18px;border-bottom:1px solid var(--line2);font-size:14.5px}
td.m{font-family:var(--mono);font-size:12.5px}
.ledger{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-lg);overflow:auto;box-shadow:var(--sh1)}
.mth{font:600 9px var(--mono);letter-spacing:.12em;padding:4px 8px;border-radius:8px;color:#fff;background:var(--rose)}
.mth.get{background:var(--ink2)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);font:600 12px var(--mono);
  padding:12px 20px;border-radius:999px;box-shadow:var(--sh2);opacity:0;transition:opacity .3s;z-index:200}
.toast.on{opacity:1}
footer{text-align:center;font:600 10px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--ink3);padding:0 0 40px}
footer em{font-family:var(--serif);font-style:italic;text-transform:none;letter-spacing:0;font-size:14px;color:var(--rose-deep)}
.row2{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}
.row2 .btn{margin-top:0;padding:12px 16px}
.switch{display:flex;align-items:center;gap:10px;margin-top:14px;font:600 13px var(--sans);color:var(--ink2);cursor:pointer}
.switch input{width:auto;accent-color:var(--rose)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn.sm{padding:9px 16px;font-size:12.5px}
.keybox{border:1px solid rgba(181,101,118,.4);background:linear-gradient(180deg,var(--surface),#fbf4f6)}
.sec{margin-bottom:22px}.sec h3{display:flex;align-items:center;gap:10px}
.sub{border-top:1px dashed var(--line);margin-top:16px;padding-top:6px}
.sub>.meta{margin-top:10px;color:var(--rose-deep)}
.hint{font-size:12.5px;color:var(--ink3);margin-top:4px}
.savebar{position:sticky;bottom:16px;display:flex;justify-content:flex-end;gap:10px;margin-top:10px;z-index:20}
details.adv summary{cursor:pointer;font:600 10px var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--ink3);margin-top:16px}
.progress{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--rose),var(--rose-deep));border-radius:0 4px 4px 0;z-index:130;transition:width .4s var(--ease),opacity .4s}
.progress.on{width:72%;transition:width 6s cubic-bezier(.1,.6,.2,1)}
.progress.done{width:100%;opacity:0}
/* abertura */
#boot{position:fixed;inset:0;z-index:150;display:grid;place-items:center;background:var(--bg);transition:opacity .6s var(--ease),visibility .6s}
#boot.off{opacity:0;visibility:hidden}
#boot .in{text-align:center}
#boot .star{font-size:64px;color:var(--rose);display:inline-block;animation:spin 3.2s linear infinite}
#boot h2{font-family:var(--serif);font-weight:700;font-size:44px;margin:14px 0 4px}
#boot h2 em{font-style:italic;color:var(--rose-deep)}
#boot p{font-family:var(--serif);font-style:italic;color:var(--ink2)}
@keyframes spin{to{transform:rotate(360deg)}}
/* faixa de carregamento do modelo */
.loadband{display:none;align-items:center;gap:14px;margin-bottom:24px;padding:14px 20px;border-radius:999px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--sh1)}
.loadband.on{display:flex}
.loadband .star{color:var(--rose);animation:spin 2.4s linear infinite;display:inline-block}
.loadband .bar{flex:1;height:8px;border-radius:999px;background:var(--bg2);overflow:hidden;position:relative}
.loadband .bar i{position:absolute;inset:0;width:40%;border-radius:999px;background:linear-gradient(90deg,var(--rose),var(--rose-deep));animation:slide 1.6s var(--ease) infinite}
@keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(260%)}}
/* esqueletos */
.sk{border-radius:var(--r-lg);min-height:180px;background:linear-gradient(100deg,var(--surface) 30%,#f3ece6 50%,var(--surface) 70%);background-size:300% 100%;animation:shim 1.4s linear infinite;border:1px solid var(--line)}
@keyframes shim{to{background-position:-150% 0}}
/* cabeçalho com gravura */
.hd{display:grid;grid-template-columns:1fr 230px;gap:36px;align-items:center}
.plate{height:200px;border-radius:22px;overflow:hidden;border:1px solid var(--line);background:var(--surface);box-shadow:var(--sh2);padding:9px;transform:rotate(2deg);animation:floaty 11s ease-in-out infinite}
.plate img{width:100%;height:100%;object-fit:cover;border-radius:14px;mix-blend-mode:multiply;display:block}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(2deg)}50%{transform:translateY(-10px) rotate(2deg)}}
.plate.orn{display:grid;place-items:center;background:radial-gradient(circle,var(--rose-soft),var(--surface) 70%);font-size:84px;color:var(--rose)}
.emptyart{display:grid;justify-items:center;gap:16px;padding:40px 0}
.emptyart .plate{width:220px;height:180px;transform:rotate(-2deg)}
.btn[aria-busy=true]{pointer-events:none;opacity:.8}
.btn[aria-busy=true]::after{content:"";width:14px;height:14px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite}
.qi{display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;background:var(--rose-soft);color:var(--rose-deep);font:700 10px var(--sans);letter-spacing:0;text-transform:none;margin-left:6px;cursor:help;vertical-align:1px;position:relative}
[data-tip]{position:relative}
[data-tip]:hover::after,[data-tip]:focus-visible::after{content:attr(data-tip);position:absolute;left:50%;top:calc(100% + 10px);transform:translateX(-50%);z-index:300;
  width:max-content;max-width:300px;white-space:normal;text-align:left;font:500 12.5px/1.5 var(--sans);letter-spacing:0;text-transform:none;color:var(--bg);background:var(--ink);
  padding:10px 13px;border-radius:12px;box-shadow:var(--sh2);pointer-events:none;animation:fadein .18s var(--ease)}
[data-tip]:hover::before,[data-tip]:focus-visible::before{content:"";position:absolute;left:50%;top:calc(100% + 4px);transform:translateX(-50%) rotate(45deg);width:10px;height:10px;background:var(--ink);z-index:301}
.qi[data-tip]:hover::after{left:0;transform:none}.qi[data-tip]:hover::before{left:4px;transform:rotate(45deg)}
details.how{margin:-12px 0 28px;max-width:820px}
details.how summary{cursor:pointer;font:600 11px var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--rose-deep);list-style:none;display:inline-flex;gap:8px;align-items:center;padding:8px 14px;border-radius:999px;background:var(--rose-soft)}
details.how summary::before{content:"?";font-family:var(--sans)}
details.how[open] summary{margin-bottom:12px}
details.how ol,details.how ul{margin:0 0 0 20px;color:var(--ink2);font-size:14.5px}
details.how li{margin:6px 0}
.tour{border:1px solid rgba(181,101,118,.35);background:linear-gradient(135deg,var(--surface),#fbf1f3);margin-bottom:26px}
.tour ol{list-style:none;counter-reset:t;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:14px}
.tour li{counter-increment:t;position:relative;padding:14px 14px 14px 58px;border-radius:18px;background:var(--surface);border:1px solid var(--line);font-size:14px;color:var(--ink2);cursor:pointer;transition:transform .3s var(--ease),box-shadow .3s}
.tour li:hover{transform:translateY(-3px);box-shadow:var(--sh1)}
.tour li::before{content:counter(t);position:absolute;left:14px;top:14px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--rose-soft);color:var(--rose-deep);font:600 15px var(--serif)}
.tour li.done::before{content:"✓";background:linear-gradient(135deg,var(--rose),var(--rose-deep));color:#fff}
.tour li b{display:block;color:var(--ink);font-family:var(--serif);font-weight:600;font-size:16px}
.x{float:right;background:none;border:0;color:var(--ink3);font:600 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;cursor:pointer}
@media(max-width:860px){.hd{grid-template-columns:1fr}.plate{display:none}}
@media(max-width:760px){.navpill{border-radius:26px;padding:12px 16px}.navlinks{margin-left:0;width:100%}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
"use strict";
const T={eventos:"Eventos",modelos:"Modelos",pend:"Confirmações",testar:"Testar",arvores:"Árvores",api:"API",config:"Configurações",estado:"Estado"};
let tab=(location.hash||"#eventos").slice(1); if(!T[tab]) tab="eventos";
const $=id=>document.getElementById(id);
let busy=0;function prog(on){const e=$("prog");if(!e)return;busy+=on?1:-1;if(busy>0){e.classList.remove("done");e.classList.add("on")}else{e.classList.remove("on");e.classList.add("done");setTimeout(()=>{if(busy<=0){e.classList.remove("done");e.style.width=""}},500)}}
const api=(p,b,quiet)=>{if(!quiet)prog(true);return fetch(p,b?{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)}:{}).then(r=>r.json()).finally(()=>{if(!quiet)prog(false)})};
let IMGS=[];fetch("/static/img/index.json").then(r=>r.json()).then(x=>{IMGS=Array.isArray(x)?x:[];draw()}).catch(()=>{});
const ART={eventos:"flores",modelos:"origem",pend:"borboletas",testar:"medusas",arvores:"colibris",api:"ceu",config:"borboletas",estado:"ceu"};
const qi=t=>t?`<span class="qi" tabindex="0" data-tip="${esc(t)}">?</span>`:"";
const NAVTIP={eventos:"Tudo que chegou (notificações, e-mails, arquivos, outros programas) e o caminho de decisões de cada um.",modelos:"Escolha, proteja e carregue os modelos que tomam as decisões.",pend:"Ações que só acontecem depois que você aprova.",testar:"Experimente um texto agora, pelas árvores ou com uma consulta direta.",arvores:"O desenho das decisões: cada resposta escolhe os próximos passos.",api:"Endereços para outros programas usarem os modelos.",config:"Todas as opções do programa, sem editar arquivos.",estado:"O que está ligado, carregado e funcionando."};
function plate(k,cls=""){let n=ART[k];if(!IMGS.includes(n)&&IMGS.length){let h=0;for(const c of k)h=(h*31+c.charCodeAt(0))>>>0;n=IMGS[h%IMGS.length]}return IMGS.includes(n)?`<figure class="plate ${cls}"><img src="/static/img/${n}.webp" alt="" loading="lazy"></figure>`:`<figure class="plate orn ${cls}">✳</figure>`}
function empty(t){return `<div class="emptyart">${plate(tab)}<p class="empty" style="padding:0">✳ ${t} ✳</p></div>`}
async function busyBtn(btn,fn){if(btn){btn.setAttribute("aria-busy","true")}try{return await fn()}finally{if(btn)btn.removeAttribute("aria-busy")}}
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pct=p=>p==null?"":` <span class="p">p ${(+p).toFixed(2)}</span>`;
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("on");setTimeout(()=>e.classList.remove("on"),2200)}
function nav(){$("nav").innerHTML=Object.entries(T).map(([k,v])=>`<button class="${k==tab?"on":""}" onclick="go('${k}')" data-tip="${esc(NAVTIP[k]||"")}">${v}</button>`).join("")}
function go(k){tab=k;location.hash=k;draw()}
const HOW={
eventos:["Um evento é qualquer texto que chega: uma notificação, um e-mail, um arquivo novo numa pasta observada, o que você copia, ou o que outro programa envia.","Cada evento passa pelas árvores que combinam com ele. Cada nó é uma decisão do modelo (escolher, verificar, dar nota, contar) ou uma ação (avisar, gravar, chamar outro programa).","O caminho mostra a resposta de cada nó, a certeza (p) e o tempo. “Abstém” quer dizer que o modelo não teve certeza suficiente e seguiu o caminho de dúvida."],
modelos:["Um modelo é a “cabeça” que decide. O Flash vem dentro do programa e é feito para computadores modestos; o Origo completo é mais preciso, mas pede mais memória.","Carregar leva alguns segundos na primeira vez. Depois, cada decisão leva milissegundos.","Cada modelo carregado também atende outros programas pela API local (veja a aba API)."],
pend:["Comandos e chamadas para fora do computador (webhooks) esperam sua aprovação aqui.","Aprovar executa uma única vez. Para não precisar aprovar sempre, mude em Configurações › Ações."],
testar:["“Pelas árvores” simula um evento: o texto passa pelas árvores e você vê o caminho inteiro.","“Consulta direta” pergunta a um modelo com a linguagem do Djorge, por exemplo CHOICE [opções] FROM text ASK \"pergunta\".","Prazos com data no texto são decididos pelo relógio do computador, com 100% de certeza."],
arvores:["Cada árvore tem um nó inicial (start) e nós com tipos: choice (escolher), check (verdadeiro/falso), score (escala), multi (vários rótulos), select (quantidades e valores), if (regra sem modelo) e action (fazer algo).","branches diz para onde ir conforme a resposta: o rótulo escolhido, true/false, uma comparação como \">= 1000\", abstain (dúvida) ou default.","Use {title}, {text:80}, {assunto.answer} para montar mensagens. Salvar valida antes de aplicar."],
api:["Outros programas podem usar os modelos daqui, sem internet.","Toda chamada precisa do token: Authorization: Bearer <token>. O botão abaixo copia o token."],
config:["As mudanças valem ao salvar. Só as portas pedem reiniciar o programa.","Passe o mouse no ? de cada campo para ver o que ele faz."],
estado:["Resumo do que está ligado. Se um modelo mostrar erro, a aba Modelos diz o motivo."]};
function head(kick,title,lede){const how=HOW[tab];return `<div id="lb" class="loadband"><span class="star">✳</span><span class="meta" id="lbt">carregando o modelo…</span><div class="bar"><i></i></div></div><div class="hd"><div><p class="kicker">${kick}</p><h1>${title}</h1>${lede?`<p class="lede">${lede}</p>`:""}</div>${plate(tab)}</div>${how?`<details class="how" ${localStorage&&!seen(tab)?"open":""} ontoggle="markSeen('${tab}')"><summary>Como funciona</summary><ol>${how.map(x=>`<li>${x}</li>`).join("")}</ol></details>`:""}`}
function tour(st,h){try{if(localStorage.getItem("djtour")=="0")return ""}catch(e){}
  const steps=[["modelos","Escolha um modelo","Proteja e carregue o Origo na aba Modelos.",st.loaded.length>0],["testar","Faça um teste","Mande um texto pelas árvores e veja a decisão.",h.length>0],
   ["config","Ligue uma fonte","Notificações, pastas, e-mail ou outro programa, em Configurações.",Object.keys(st.connectors||{}).length>0],["arvores","Ajuste as árvores","Diga o que fazer com cada resposta.",false]];
  if(steps.slice(0,3).every(x=>x[3]))return "";
  return `<article class="card tour"><button class="x" onclick="try{localStorage.setItem('djtour','0')}catch(e){};draw()" data-tip="Esconde este guia. Ele não volta.">fechar ✕</button><h3>Comece por aqui</h3><p class="text">Quatro passos para o Djorge começar a decidir por você.</p><ol>${steps.map(x=>`<li class="${x[3]?"done":""}" onclick="go('${x[0]}')"><b>${x[1]}</b>${x[2]}</li>`).join("")}</ol></article>`}
function seen(k){try{return localStorage.getItem("djhow-"+k)=="1"}catch(e){return true}}
function markSeen(k){try{localStorage.setItem("djhow-"+k,"1")}catch(e){}}
function ans(s){if(s.action)return `${esc(s.action)} · ${esc(s.status)}`;
  if(s.error)return `<span class="chip soft">erro</span> ${esc(s.error)}`;
  const a=s.selected?s.selected.join(", "):(s.answer??s.value);return `${esc(a)}${pct(s.probability)}${s.abstain?' <span class="chip soft">abstém</span>':""}${s.grounding&&s.grounding!="classifier"?` <span class="chip soft">${esc(s.grounding)}</span>`:""}`}
function trail(r){return (r.runs||[]).map(x=>`<div class="meta" style="margin-top:12px">árvore · ${esc(x.tree)}</div>${x.error?`<p class="text">${esc(x.error)}</p>`:""}<ul class="trail">${(x.trail||[]).map(s=>`<li class="${s.action?"act":""}"><b>${esc(s.node)}</b> — ${ans(s)} <span class="meta">${s.ms??""} ms</span></li>`).join("")}</ul>`).join("")}
let first=true,LOADING=false;
async function draw(){nav();const m=$("m");if(first||m.dataset.tab!=tab){m.innerHTML=`<div class="grid">${"<div class='sk'></div>".repeat(3)}</div>`;m.dataset.tab=tab}
 if(tab=="eventos"){const h=(await api("/api/history?n=80")).filter(r=>r.type=="event");const st0=await api("/api/status",null,true);
  m.innerHTML=head("Cap. I — O que chegou","Eventos e <span class='it'>decisões</span>.","Cada notificação, e-mail, arquivo ou texto enviado por outro programa passa pelas árvores. Aqui fica o caminho percorrido.")+tour(st0,h)+
  (h.length?`<div class="grid">${h.map(r=>`<article class="card"><div class="meta">${esc(String(r.t).replace("T"," "))} · ${esc(r.event.source)}${r.event.app?" · "+esc(r.event.app):""}</div><h3>${esc(r.event.title||"(sem título)")}</h3><p class="text">${esc((r.event.text||"").slice(0,320))}</p>${trail(r)}</article>`).join("")}</div>`:empty("nenhum evento ainda"))}
 if(tab=="modelos"){const r=await api("/api/models");const pick=!!(window.pywebview&&window.pywebview.api);
  const st=x=>x=="pronto"?"p":"soft";
  m.innerHTML=head("Cap. II — Os modelos","Escolha <span class='it'>quem decide</span>.","O Flash já vem dentro do programa e carrega sozinho. Para usar outro modelo, aponte a pasta dele.")+
  `<div class="grid">${r.models.map(x=>`<article class="card" id="mc-${esc(x.name)}"><div class="meta">${x.bundled?"incluído no programa":"pasta"}${x.api?" · "+esc(x.api):""}</div>
   <h3>${esc(x.name)} <span class="chip ${st(x.state)}">${esc(x.state)}</span></h3>
   <label>descrição${qi("Só para você reconhecer o modelo.")}</label><input data-f="role" value="${esc(x.role)}">
   ${x.service?`<p class="text">Usado só pela extensão do Chrome. Carrega quando a extensão pergunta algo${qi("Não aparece nas árvores. Em computadores com pouca memória, sai da memória depois de alguns minutos sem uso.")}.</p>`:""}
   ${x.bundled?`<p class="text">Vem com o programa — não precisa baixar nem configurar nada.</p>`:`<label>pasta do modelo${qi("A pasta que contém metadata/djorge.json.")}</label><div class="row2"><input data-f="path" value="${esc(x.path)}" placeholder="C:\\Modelos\\origo">${pick?`<button class="btn btn-ghost" onclick="pickTo('${esc(x.name)}','path','folder')">Escolher</button>`:""}</div>`}
   <label class="switch"><input type="checkbox" data-f="enabled" ${x.enabled?"checked":""}> ligado${qi("Ligado: carrega ao abrir o programa.")}</label>
   <div class="acts"><button class="btn btn-rose sm" data-tip="Grava as mudanças e carrega o modelo agora." onclick="busyBtn(this,()=>saveM('${esc(x.name)}',true))">Salvar e carregar ✳</button>
   ${x.state=="pronto"?`<button class="btn btn-ghost sm" data-tip="Libera a memória. O modelo para de responder até carregar de novo." onclick="actM('unload','${esc(x.name)}')">Descarregar</button>`:""}
   ${x.bundled?"":`<button class="btn btn-ghost sm" onclick="if(confirm('Remover ${esc(x.name)} da lista?'))actM('remove','${esc(x.name)}')">Remover</button>`}</div></article>`).join("")}
   ${r.models.some(x=>x.service)?`<article class="card"><h3>Extensão do Chrome</h3><p class="text">Na extensão <b>Djorge Sentinel — Guarda</b>, clique em <b>Usar o Djorge Local</b> e cole este código de pareamento.</p>
   <label>endereço${qi("A extensão fala só com este computador.")}</label><input readonly value="http://127.0.0.1:${esc(r.sentinel_port||8760)}">
   <button class="btn btn-rose" onclick="busyBtn(this,()=>copyTok())">Copiar código de pareamento ✳</button></article>`:""}
   <article class="card"><h3>Adicionar outro modelo</h3><p class="text">Outra versão do Origo ou um especialista: dê um nome e aponte a pasta.</p>
   <label>nome${qi("Como o modelo vai aparecer aqui e na API (ex.: origo).")}</label><input id="nn" placeholder="origo">
   <label>pasta do modelo${qi("A pasta que contém metadata/djorge.json. Ela não é alterada.")}</label><div class="row2"><input id="np" placeholder="C:\\Modelos\\origo">${pick?`<button class="btn btn-ghost" onclick="pickId('np','folder')">Escolher</button>`:""}</div>
   <button class="btn btn-rose" onclick="busyBtn(this,()=>newM())">Adicionar e carregar ✳</button>
   <label>processador${qi("auto usa a placa de vídeo se houver. Vale ao carregar o modelo de novo.")}</label><select id="dev" onchange="setDev()">${["auto","cpu","cuda"].map(d=>`<option ${d==r.device?"selected":""}>${d}</option>`).join("")}</select></article></div>`}
 if(tab=="pend"){const p=await api("/api/pending");
  m.innerHTML=head("Cap. III — Antes de agir","Ações que esperam <span class='it'>você</span>.","Comandos, webhooks e gravação de arquivos só acontecem depois da sua aprovação.")+
  (p.length?`<div class="grid">${p.map(x=>`<article class="card"><span class="chip p">${esc(x.spec.action)}</span><h3 style="margin-top:10px">${esc(x.tree)} / ${esc(x.node)}</h3><pre>${esc(JSON.stringify(x.spec,null,1))}</pre><button class="btn btn-rose" onclick="ok('${x.id}',true)">Aprovar ✳</button> <button class="btn btn-ghost" onclick="ok('${x.id}',false)">Recusar</button></article>`).join("")}</div>`:empty("nada aguardando"))}
 if(tab=="testar"){m.innerHTML=head("Cap. IV — Experimente","Uma decisão, <span class='it'>ao vivo</span>.","Rode um texto pelas árvores ou faça uma consulta direta a um modelo.")+
  `<div class="grid"><article class="card"><h3>Pelas árvores</h3><label>título</label><input id="ti" placeholder="ex.: Banco"><label>texto</label><textarea id="tx" rows="7" placeholder="Seu boleto de R$ 1.200,00 vence em 20/10."></textarea><label>árvore (vazio = todas que casarem)</label><input id="tr"><button class="btn btn-rose" onclick="busyBtn(this,()=>ev())">Decidir ✳</button></article>
  <article class="card"><h3>Consulta direta</h3><label>modelo</label><select id="mo">${(await api("/api/models")).models.filter(x=>x.state=="pronto"&&!x.service).map(x=>`<option>${esc(x.name)}</option>`).join("")||"<option disabled>nenhum modelo carregado</option>"}</select><label>consulta</label><input id="q" value='CHOICE ["urgente","normal"] FROM text ASK "Qual a prioridade?"'><label>texto</label><textarea id="tq" rows="5"></textarea><button class="btn btn-rose" onclick="busyBtn(this,()=>dq())">Executar ✳</button></article></div><div id="out"></div>`}
 if(tab=="arvores"){const t=await api("/api/trees");m.innerHTML=head("Cap. V — O desenho","Árvores de <span class='it'>decisões subsequentes</span>.","Cada resposta escolhe as próximas decisões. Edite, valide e salve — vale na hora, sem reiniciar.")+
  `<article class="card"><textarea id="ya" rows="30" spellcheck="false">${esc(t.yaml)}</textarea><button class="btn btn-rose" onclick="busyBtn(this,()=>sv())">Validar e salvar ✳</button> <span id="sm" class="meta" style="margin-left:12px"></span></article>`}
 if(tab=="api"){const s=await api("/api/status");const eps=[["POST","/v1/classify","rótulos, multi, certainty, prediction_set"],["POST","/v1/verify","verdadeiro ou falso"],["POST","/v1/score","escala ordenada"],["POST","/v1/select","só a opção ou o trecho"],["POST","/v1/aggregate","quantidades (AGG / AGID)"],["POST","/v1/tag","trechos e entidades"],["POST","/v1/decide","regras compostas → ações sugeridas"],["POST","/v1/document","documentos longos"],["POST","/v1/tools/<nome>","pii · mask · lang · validate · math · time"],["POST","/execute","qualquer consulta da linguagem"],["GET","/capabilities","o que o modelo sabe fazer"],["GET","/health","estado"]];
  const base=Object.entries(s.api||{});m.innerHTML=head("Cap. VI — A API","Tudo, <span class='it'>localmente</span>.","Cada modelo carregado tem a API inteira do DJORGE nesta máquina. Autenticação: <code>Authorization: Bearer &lt;token&gt;</code> — o mesmo token do painel.")+
  `<div class="stats">${base.map(([k,u])=>`<div class="stat"><div class="big">${esc(k)}</div><div class="cap">${esc(u)}</div></div>`).join("")||`<div class="stat"><div class="big">—</div><div class="cap">nenhum modelo carregado</div></div>`}</div>
  <div class="ledger"><table><thead><tr><th>método</th><th>rota</th><th>o que faz</th></tr></thead><tbody>${eps.map(e=>`<tr><td><span class="mth ${e[0]=="GET"?"get":""}">${e[0]}</span></td><td class="m">${esc(e[1])}</td><td>${esc(e[2])}</td></tr>`).join("")}</tbody></table></div>
  <pre>curl ${esc((base[0]||["","http://127.0.0.1:8750"])[1])}/v1/classify \\
  -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \\
  -d '{"text":"O boleto vence amanhã","labels":["cobrança","entrega","outro"]}'</pre>
  <button class="btn btn-ghost" onclick="copyTok()">Copiar token</button>`}
 if(tab=="config"){CFG=await api("/api/config");
  m.innerHTML=head("Cap. VII — Ajustes","Tudo <span class='it'>no seu controle</span>.","Cada opção do Djorge Local, sem editar arquivos. Salvar aplica na hora; mudanças de porta pedem reiniciar.")+
  Object.entries(CFG).filter(([k])=>!SKIP.has(k)).map(([k,v])=>typeof v=="object"&&!Array.isArray(v)?`<article class="card sec"><h3>${esc(L(k))}</h3>${H[k]?`<p class="hint">${esc(H[k])}</p>`:""}${form(v,k)}</article>`:"").join("")+
  `<article class="card sec"><h3>Geral</h3>${form(Object.fromEntries(Object.entries(CFG).filter(([k,v])=>typeof v!="object"||Array.isArray(v))),"")}</article>
  <div class="savebar"><button class="btn btn-ghost" onclick="draw()">Descartar</button><button class="btn btn-rose" onclick="busyBtn(this,()=>saveCfg())">Salvar ajustes ✳</button></div>`}
 if(tab=="estado"){const s=await api("/api/status");const ms=s.model_state||{};
  m.innerHTML=head("Cap. VIII — Por dentro","Estado do <span class='it'>sistema</span>.","")+
  `<div class="stats"><div class="stat"><div class="big">${s.loaded.length}</div><div class="cap">modelos prontos</div></div><div class="stat"><div class="big">${s.trees.length}</div><div class="cap">árvores</div></div><div class="stat"><div class="big">${Object.keys(s.connectors).length}</div><div class="cap">conectores ativos</div></div><div class="stat"><div class="big">${s.pending}</div><div class="cap">confirmações</div></div></div>
  <div class="grid"><article class="card"><h3>Modelos</h3>${Object.entries(s.models).map(([k,v])=>`<p class="text"><b>${esc(k)}</b> — ${esc(v.role)} <span class="chip ${ms[k]=="pronto"?"p":"soft"}">${esc(ms[k]||(v.enabled?"aguardando":"desligado"))}</span></p>`).join("")}</article>
  <article class="card"><h3>Conectores</h3>${Object.entries(s.connectors).map(([k,v])=>`<p class="text"><b>${esc(k)}</b> — ${esc(v)}</p>`).join("")||'<p class="text">Só a API local (ative outros no config.yaml).</p>'}</article></div>`}
 live()}
async function live(){try{const s=await api("/api/status",null,true);if(first){first=false;setTimeout(()=>$("boot").classList.add("off"),350)}
  const ld=Object.entries(s.model_state||{}).filter(([k,v])=>v=="carregando").map(([k])=>k);const was=LOADING;LOADING=ld.length>0;if(was&&!LOADING&&tab=="modelos")draw();const lb=$("lb");if(lb){lb.classList.toggle("on",ld.length>0);if(ld.length)$("lbt").textContent="carregando "+ld.join(", ")+"… a primeira vez leva alguns segundos"}const ok=s.loaded.length>0;const l=$("live");l.classList.toggle("ok",ok);
  l.querySelector("span").textContent=ok?`${s.loaded.join(" · ")} · fila ${s.queue}`:(Object.values(s.model_state||{}).includes("carregando")?"carregando…":"sem modelo")}catch(e){}}
let CFG={};const SKIP=new Set([]);
const LBL={timezone:"Fuso horário",language:"Idioma",device:"Processador",threads:"Núcleos de CPU (0 = todos)",open_panel_on_start:"Abrir a janela ao iniciar",max_steps:"Máximo de passos por árvore",economy:"Modo econômico de memória",
 server:"Painel",host:"Endereço",port:"Porta",api:"API local",enabled:"Ligado",batch_window_ms:"Junção de pedidos (ms)",rate_rps:"Pedidos por segundo",rate_burst:"Pico de pedidos",max_body_mb:"Tamanho máximo do pedido (MB)",
 connectors:"Conectores",http_inbox:"Outros programas (API de eventos)",notifications:"Notificações do sistema",apps_allow:"Só destes apps (um por linha)",apps_deny:"Ignorar estes apps",poll_s:"Verificar a cada (s)",
 folder:"Pastas observadas",paths:"Pastas (uma por linha)",patterns:"Tipos de arquivo",max_mb:"Tamanho máximo (MB)",clipboard:"Área de transferência",min_chars:"Mínimo de caracteres",
 imap:"E-mail (IMAP, só leitura)",user:"Usuário",password_env:"Variável com a senha",command:"Programas consultados",jobs:"Tarefas",stdin:"Terminal",
 extract:"Leitura de arquivos",ocr:"Ler imagens (OCR)",ocr_lang:"Idiomas do OCR",audio:"Transcrever áudio",whisper_model:"Modelo de transcrição",max_chars:"Máximo de caracteres por texto",
 actions:"Ações",require_confirmation:"Pedir confirmação para",webhook_allow:"Webhooks permitidos (prefixos de URL)",command_allow:"Programas permitidos",write_dir:"Pasta para arquivos gravados",notify:"Mostrar avisos na área de trabalho",
 history:"Histórico",keep:"Guardar últimos",store_text:"Guardar o texto",mask_pii:"Mascarar dados pessoais (CPF, cartão, e-mail…)"};
const H={connectors:"De onde chegam os eventos. Tudo começa desligado.",actions:"O que as árvores podem fazer. Comandos e webhooks só rodam se estiverem nas listas.",history:"Fica só neste computador.",api:"A API completa de cada modelo, só nesta máquina."};
const L=k=>LBL[k]||k.replace(/_/g," ");
const TIP={timezone:"Usado para entender “amanhã”, “sexta que vem” e prazos.",device:"auto usa a placa de vídeo (CUDA) se existir; senão o processador.",threads:"Quantos núcleos o modelo pode usar. 0 = todos. Diminua para deixar o computador mais livre.",
 open_panel_on_start:"Mostrar a janela assim que o programa abre. Desligado, ele inicia só na bandeja.",max_steps:"Limite de decisões por evento, para evitar ciclos.",economy:"auto liga sozinho em computadores com menos de 8 GB de RAM: mesma resposta, menos memória. Valores: auto, on, off.",

function form(o,path){return Object.entries(o).map(([k,v])=>{const id=(path?path+".":"")+k;
  if(v&&typeof v=="object"&&!Array.isArray(v))return `<div class="sub"><div class="meta">${esc(L(k))}${qi(TIP[k])}</div>${form(v,id)}</div>`;
  if(typeof v=="boolean")return `<label class="switch"><input type="checkbox" data-k="${esc(id)}" ${v?"checked":""}> ${esc(L(k))}${qi(TIP[k])}</label>`;
  if(Array.isArray(v)){if(v.some(x=>typeof x=="object"))return `<label>${esc(L(k))}${qi(TIP[k])}</label><textarea data-k="${esc(id)}" data-json="1" rows="3">${esc(JSON.stringify(v,null,1))}</textarea>`;
    return `<label>${esc(L(k))}${qi(TIP[k])}</label><textarea data-k="${esc(id)}" data-list="1" rows="${Math.max(2,v.length+1)}">${esc(v.join("\n"))}</textarea>`}
  if(k=="device")return `<label>${esc(L(k))}${qi(TIP[k])}</label><select data-k="${esc(id)}">${["auto","cpu","cuda"].map(d=>`<option ${d==v?"selected":""}>${d}</option>`).join("")}</select>`;
  return `<label>${esc(L(k))}${qi(TIP[k])}</label><input data-k="${esc(id)}" value="${esc(v)}" ${typeof v=="number"?'inputmode="decimal"':""}>`}).join("")}
async function saveCfg(){const out={};document.querySelectorAll("[data-k]").forEach(e=>{const ks=e.dataset.k.split(".");let o=out;ks.slice(0,-1).forEach(k=>o=o[k]=o[k]||{});
  let v=e.type=="checkbox"?e.checked:e.value;if(e.dataset.json){try{v=JSON.parse(v)}catch(x){toast("JSON inválido em "+e.dataset.k);throw x}}o[ks[ks.length-1]]=v});
  const r=await api("/api/config",out);toast(r.error||(r.restart&&r.restart.length?"salvo · reinicie para mudar "+r.restart.join(", "):"ajustes salvos"));if(!r.error)draw()}
function fields(n){const c=$("mc-"+n),o={name:n};c.querySelectorAll("[data-f]").forEach(e=>o[e.dataset.f]=e.type=="checkbox"?e.checked:e.value);return o}
async function saveM(n,load){const r=await api("/api/models/save",{...fields(n),load});toast(r.error||"salvo"+(load?" · carregando…":""));draw()}
async function actM(a,n){const r=await api("/api/models/"+a,{name:n});toast(r.error||({unload:"descarregado",remove:"removido",load:"carregando…"}[a]||"ok"));draw()}
async function newM(){const n=$("nn").value.trim().toLowerCase();const r=await api("/api/models/save",{name:n,path:$("np").value.trim(),enabled:true,load:true});toast(r.error||"adicionado · carregando…");draw()}
async function setDev(){await api("/api/models/settings",{device:$("dev").value});toast("vale ao carregar de novo")}
async function pickId(id,kind){const p=await window.pywebview.api.pick(kind);if(p)$(id).value=p}
async function pickTo(n,f,kind){const p=await window.pywebview.api.pick(kind);if(p){$("mc-"+n).querySelector(`[data-f="${f}"]`).value=p}}
async function ok(id,a){await api("/api/pending/"+id,{approve:a});toast(a?"aprovado":"recusado");draw()}
async function ev(){const r=await api("/api/event",{sync:true,title:$("ti").value,text:$("tx").value,tree:$("tr").value||undefined,source:"teste"});
  $("out").innerHTML=`<article class="card" style="margin-top:22px"><h3>Caminho percorrido</h3>${trail(r)||'<p class="text">Nenhuma árvore casou com este evento.</p>'}<pre>${esc(JSON.stringify(r,null,1))}</pre></article>`}
async function dq(){const r=await api("/api/decide",{model:$("mo").value,query:$("q").value,text:$("tq").value});const x=r.result||{};
  $("out").innerHTML=`<article class="card" style="margin-top:22px"><div class="meta">resposta</div><h3 style="font-size:34px">${esc(x.answer??x.value??(x.selected||[]).join(", ")??r.error)}</h3>${pct(x.probability)}<pre>${esc(JSON.stringify(r,null,1))}</pre></article>`}
async function sv(){const r=await api("/api/trees",{yaml:$("ya").value});$("sm").textContent=r.error?r.error:`ok · ${r.trees} árvore(s)`;toast(r.error?"erro na árvore":"árvores salvas")}
async function copyTok(){try{const t=(await api("/api/token")).token;await navigator.clipboard.writeText(t);toast("token copiado")}catch(e){toast("token em ~/.djorge-local/token.txt")}}
window.addEventListener("hashchange",()=>{const k=location.hash.slice(1);if(T[k]&&k!=tab){tab=k;draw()}});
api("/api/models").then(r=>{if(!location.hash&&!r.models.some(x=>x.path||x.sealed||x.state=="pronto"))tab="modelos";draw()});
let SIG="";
async function sig(){const [h,s0]=await Promise.all([api("/api/history?n=1",null,true),api("/api/status",null,true)]);return (h[0]&&h[0].t||"")+"|"+(h.length)+"|"+s0.pending+"|"+s0.loaded.join(",")}
setInterval(async()=>{try{if(tab=="eventos"||tab=="pend"){const g=await sig();if(g!==SIG){const firstSig=!SIG;SIG=g;if(!firstSig)draw();}}live()}catch(e){}},4000);
