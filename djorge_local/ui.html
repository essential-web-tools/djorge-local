<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Djorge Local</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90' fill='%23b56576'>✳</text></svg>">
<style>
@font-face{font-family:Fraunces;font-weight:400;src:url(/static/fonts/fraunces-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:Fraunces;font-weight:600;src:url(/static/fonts/fraunces-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:Fraunces;font-weight:700;src:url(/static/fonts/fraunces-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:Fraunces;font-weight:400;font-style:italic;src:url(/static/fonts/fraunces-latin-400-italic.woff2) format("woff2")}
@font-face{font-family:Fraunces;font-weight:600;font-style:italic;src:url(/static/fonts/fraunces-latin-600-italic.woff2) format("woff2")}
@font-face{font-family:Manrope;font-weight:400;src:url(/static/fonts/manrope-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:Manrope;font-weight:500;src:url(/static/fonts/manrope-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:Manrope;font-weight:600;src:url(/static/fonts/manrope-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:Manrope;font-weight:700;src:url(/static/fonts/manrope-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"JetBrains Mono";font-weight:400;src:url(/static/fonts/jetbrains-mono-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"JetBrains Mono";font-weight:600;src:url(/static/fonts/jetbrains-mono-latin-600-normal.woff2) format("woff2")}
:root{
  --bg:#f6f3ee;--bg2:#efe9e0;--surface:#fdfcf9;
  --ink:#26221e;--ink2:#5f584f;--ink3:#968d81;
  --rose:#b56576;--rose-deep:#93485b;--rose-soft:#f5e5e9;--rose-glow:rgba(181,101,118,.16);
  --line:rgba(38,34,30,.10);--line2:rgba(38,34,30,.06);
  --sh1:0 10px 30px rgba(38,34,30,.07);--sh2:0 26px 60px rgba(38,34,30,.12);
  --serif:'Fraunces',Georgia,serif;--sans:'Manrope',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace;
  --r-lg:28px;--r-md:20px;--r-sm:14px;--ease:cubic-bezier(.22,.61,.21,1)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--sans);color:var(--ink);line-height:1.6;background:var(--bg);min-height:100vh;overflow-x:hidden;
  background-image:radial-gradient(900px 500px at 90% -6%,var(--rose-glow),transparent 60%),
                   radial-gradient(800px 480px at -10% 40%,rgba(239,233,224,.9),transparent 62%)}
::selection{background:var(--rose);color:#fff}
.grain{position:fixed;inset:0;z-index:90;pointer-events:none;opacity:.22;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/><feComponentTransfer><feFuncA type='linear' slope='0.3'/></feComponentTransfer></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
code{font-family:var(--mono);font-size:.88em;background:var(--rose-soft);color:var(--rose-deep);padding:1px 6px;border-radius:6px}
/* nav */
.navpill{position:sticky;top:14px;z-index:110;margin:14px auto 0;width:min(1180px,calc(100% - 24px));display:flex;align-items:center;gap:14px;
  padding:10px 12px 10px 24px;border-radius:999px;border:1px solid var(--line);background:rgba(253,252,249,.78);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:var(--sh1);flex-wrap:wrap}
.brand{font-family:var(--serif);font-weight:700;font-size:19px;white-space:nowrap}
.brand em{font-style:italic;color:var(--rose-deep)}
.navlinks{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.navlinks button{font:600 13px var(--sans);color:var(--ink2);background:none;border:0;padding:9px 14px;border-radius:999px;cursor:pointer;
  transition:background .3s var(--ease),color .3s var(--ease)}
.navlinks button:hover{background:var(--rose-soft);color:var(--rose-deep)}
.navlinks button.on{background:linear-gradient(135deg,var(--rose),var(--rose-deep));color:#fff;box-shadow:0 8px 20px var(--rose-glow)}
.live{display:flex;align-items:center;gap:8px;font:600 10px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ink3)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--ink3)}
.live.ok i{background:var(--rose);box-shadow:0 0 0 4px var(--rose-glow);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.75}50%{transform:scale(1.15);opacity:1}}
/* layout */
main{width:min(1180px,calc(100% - 32px));margin:0 auto;padding:46px 0 90px}
.kicker{font:600 11px var(--mono);letter-spacing:.4em;text-transform:uppercase;color:var(--rose-deep)}
h1{font-family:var(--serif);font-weight:600;font-size:clamp(30px,4.2vw,52px);line-height:1.08;letter-spacing:-.015em;margin:.35em 0 .3em}
h1 .it{font-style:italic;color:var(--rose-deep)}
.lede{color:var(--ink2);max-width:760px;margin-bottom:30px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:22px}
.card{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-lg);padding:24px 24px 26px;box-shadow:var(--sh1);
  transition:transform .4s var(--ease),box-shadow .4s var(--ease),border-color .4s;animation:fadein .5s var(--ease) both}
.card:hover{box-shadow:var(--sh2)}
@keyframes fadein{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card h3{font-family:var(--serif);font-weight:600;font-size:20px;line-height:1.2;margin-bottom:6px}
.meta{font:600 10px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--ink3)}
.text{color:var(--ink2);font-size:14.5px;margin:10px 0 4px;white-space:pre-wrap;word-break:break-word}
.chip{display:inline-block;font:600 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;padding:7px 13px;border-radius:999px;
  border:1px solid var(--line);background:var(--surface);color:var(--ink2);margin:3px 4px 3px 0}
.chip.p{background:linear-gradient(135deg,var(--rose),var(--rose-deep));color:#fff;border-color:transparent;box-shadow:0 8px 20px var(--rose-glow)}
.chip.soft{background:var(--bg2);border-color:transparent}
/* trilha de decisões */
.trail{list-style:none;margin-top:14px;border-top:1px dashed var(--line);padding-top:10px}
.trail li{position:relative;padding:9px 0 9px 34px;font-size:14.5px;color:var(--ink2);border-bottom:1px dashed var(--line)}
.trail li:last-child{border-bottom:0}
.trail li::before{content:"✳";position:absolute;left:6px;top:9px;color:var(--rose)}
.trail li.act::before{content:"→";color:var(--rose-deep);font-weight:700}
.trail b{color:var(--ink);font-family:var(--serif);font-weight:600}
.p{font:600 11px var(--mono);color:var(--rose-deep)}
/* formulários */
label{display:block;font:600 10px var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--ink3);margin:14px 0 6px}
input,textarea,select{width:100%;font:14px var(--sans);color:var(--ink);background:var(--bg);border:1px solid var(--line);
  border-radius:var(--r-sm);padding:12px 14px;outline:none;transition:border-color .3s,box-shadow .3s}
textarea{font-family:var(--mono);font-size:13px;line-height:1.6}
input:focus,textarea:focus,select:focus{border-color:var(--rose);box-shadow:0 0 0 4px var(--rose-glow)}
.btn{display:inline-flex;align-items:center;gap:8px;font:700 13.5px var(--sans);padding:12px 24px;border-radius:999px;border:1px solid transparent;
  cursor:pointer;margin-top:16px;transition:transform .35s var(--ease),box-shadow .35s var(--ease)}
.btn-rose{background:linear-gradient(135deg,var(--rose),var(--rose-deep));color:#fff;box-shadow:0 12px 26px var(--rose-glow)}
.btn-rose:hover{transform:translateY(-3px);box-shadow:0 18px 36px rgba(181,101,118,.3)}
.btn-ghost{background:var(--surface);color:var(--ink);border-color:var(--line);box-shadow:var(--sh1)}
.btn-ghost:hover{transform:translateY(-3px);border-color:var(--rose);color:var(--rose-deep)}
pre{border-radius:var(--r-md);background:#241f1b;color:#efe9e2;box-shadow:var(--sh2);padding:22px;overflow:auto;
  font:12.5px/1.75 var(--mono);margin-top:16px;max-height:560px;white-space:pre-wrap;word-break:break-word}
.empty{font:600 11px var(--mono);letter-spacing:.3em;text-transform:uppercase;color:var(--ink3);text-align:center;padding:60px 0}
/* estado */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:20px;margin-bottom:26px}
.stat{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-lg);padding:24px 18px;text-align:center;box-shadow:var(--sh1)}
.stat .big{font-family:var(--serif);font-weight:600;font-size:clamp(28px,3vw,42px);color:var(--rose-deep);line-height:1}
.stat .cap{font:600 10px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--ink3);margin-top:10px}
table{width:100%;border-collapse:collapse}
th{font:600 10px var(--mono);letter-spacing:.2em;text-transform:uppercase;text-align:left;padding:14px 18px;background:var(--bg2);color:var(--ink2)}
td{padding:14px 18px;border-bottom:1px solid var(--line2);font-size:14.5px}
td.m{font-family:var(--mono);font-size:12.5px}
.ledger{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-lg);overflow:auto;box-shadow:var(--sh1)}
.mth{font:600 9px var(--mono);letter-spacing:.12em;padding:4px 8px;border-radius:8px;color:#fff;background:var(--rose)}
.mth.get{background:var(--ink2)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);font:600 12px var(--mono);
  padding:12px 20px;border-radius:999px;box-shadow:var(--sh2);opacity:0;transition:opacity .3s;z-index:200}
.toast.on{opacity:1}
footer{text-align:center;font:600 10px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--ink3);padding:0 0 40px}
footer em{font-family:var(--serif);font-style:italic;text-transform:none;letter-spacing:0;font-size:14px;color:var(--rose-deep)}
@media(max-width:760px){.navpill{border-radius:26px;padding:12px 16px}.navlinks{margin-left:0;width:100%}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="grain" aria-hidden="true"></div>
<div class="navpill">
  <span class="brand">Djorge <em>Local</em> ✳</span>
  <nav class="navlinks" id="nav"></nav>
  <span class="live" id="live"><i></i><span>—</span></span>
</div>
<main id="m"></main>
<footer>Essential Web Tools · <em>toda decisão parte de uma origem</em> · roda só nesta máquina</footer>
<div class="toast" id="toast"></div>
<script>
"use strict";
const T={eventos:"Eventos",pend:"Confirmações",testar:"Testar",arvores:"Árvores",api:"API",estado:"Estado"};
let tab=(location.hash||"#eventos").slice(1); if(!T[tab]) tab="eventos";
const $=id=>document.getElementById(id);
const api=(p,b)=>fetch(p,b?{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)}:{}).then(r=>r.json());
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pct=p=>p==null?"":` <span class="p">p ${(+p).toFixed(2)}</span>`;
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("on");setTimeout(()=>e.classList.remove("on"),2200)}
function nav(){$("nav").innerHTML=Object.entries(T).map(([k,v])=>`<button class="${k==tab?"on":""}" onclick="go('${k}')">${v}</button>`).join("")}
function go(k){tab=k;location.hash=k;draw()}
function head(kick,title,lede){return `<p class="kicker">${kick}</p><h1>${title}</h1>${lede?`<p class="lede">${lede}</p>`:""}`}
function ans(s){if(s.action)return `${esc(s.action)} · ${esc(s.status)}`;
  if(s.error)return `<span class="chip soft">erro</span> ${esc(s.error)}`;
  const a=s.selected?s.selected.join(", "):(s.answer??s.value);return `${esc(a)}${pct(s.probability)}${s.abstain?' <span class="chip soft">abstém</span>':""}${s.grounding&&s.grounding!="classifier"?` <span class="chip soft">${esc(s.grounding)}</span>`:""}`}
function trail(r){return (r.runs||[]).map(x=>`<div class="meta" style="margin-top:12px">árvore · ${esc(x.tree)}</div>${x.error?`<p class="text">${esc(x.error)}</p>`:""}<ul class="trail">${(x.trail||[]).map(s=>`<li class="${s.action?"act":""}"><b>${esc(s.node)}</b> — ${ans(s)} <span class="meta">${s.ms??""} ms</span></li>`).join("")}</ul>`).join("")}
async function draw(){nav();const m=$("m");
 if(tab=="eventos"){const h=(await api("/api/history?n=80")).filter(r=>r.type=="event");
  m.innerHTML=head("Cap. I — O que chegou","Eventos e <span class='it'>decisões</span>.","Cada notificação, e-mail, arquivo ou texto enviado por outro programa passa pelas árvores. Aqui fica o caminho percorrido.")+
  (h.length?`<div class="grid">${h.map(r=>`<article class="card"><div class="meta">${esc(String(r.t).replace("T"," "))} · ${esc(r.event.source)}${r.event.app?" · "+esc(r.event.app):""}</div><h3>${esc(r.event.title||"(sem título)")}</h3><p class="text">${esc((r.event.text||"").slice(0,320))}</p>${trail(r)}</article>`).join("")}</div>`:`<p class="empty">✳ nenhum evento ainda ✳</p>`)}
 if(tab=="pend"){const p=await api("/api/pending");
  m.innerHTML=head("Cap. II — Antes de agir","Ações que esperam <span class='it'>você</span>.","Comandos, webhooks e gravação de arquivos só acontecem depois da sua aprovação.")+
  (p.length?`<div class="grid">${p.map(x=>`<article class="card"><span class="chip p">${esc(x.spec.action)}</span><h3 style="margin-top:10px">${esc(x.tree)} / ${esc(x.node)}</h3><pre>${esc(JSON.stringify(x.spec,null,1))}</pre><button class="btn btn-rose" onclick="ok('${x.id}',true)">Aprovar ✳</button> <button class="btn btn-ghost" onclick="ok('${x.id}',false)">Recusar</button></article>`).join("")}</div>`:`<p class="empty">✳ nada aguardando ✳</p>`)}
 if(tab=="testar"){m.innerHTML=head("Cap. III — Experimente","Uma decisão, <span class='it'>ao vivo</span>.","Rode um texto pelas árvores ou faça uma consulta direta a um modelo.")+
  `<div class="grid"><article class="card"><h3>Pelas árvores</h3><label>título</label><input id="ti" placeholder="ex.: Banco"><label>texto</label><textarea id="tx" rows="7" placeholder="Seu boleto de R$ 1.200,00 vence em 20/10."></textarea><label>árvore (vazio = todas que casarem)</label><input id="tr"><button class="btn btn-rose" onclick="ev()">Decidir ✳</button></article>
  <article class="card"><h3>Consulta direta</h3><label>modelo</label><select id="mo"><option>origo</option><option>flash</option></select><label>consulta</label><input id="q" value='CHOICE ["urgente","normal"] FROM text ASK "Qual a prioridade?"'><label>texto</label><textarea id="tq" rows="5"></textarea><button class="btn btn-rose" onclick="dq()">Executar ✳</button></article></div><div id="out"></div>`}
 if(tab=="arvores"){const t=await api("/api/trees");m.innerHTML=head("Cap. IV — O desenho","Árvores de <span class='it'>decisões subsequentes</span>.","Cada resposta escolhe as próximas decisões. Edite, valide e salve — vale na hora, sem reiniciar.")+
  `<article class="card"><textarea id="ya" rows="30" spellcheck="false">${esc(t.yaml)}</textarea><button class="btn btn-rose" onclick="sv()">Validar e salvar ✳</button> <span id="sm" class="meta" style="margin-left:12px"></span></article>`}
 if(tab=="api"){const s=await api("/api/status");const eps=[["POST","/v1/classify","rótulos, multi, certainty, prediction_set"],["POST","/v1/verify","verdadeiro ou falso"],["POST","/v1/score","escala ordenada"],["POST","/v1/select","só a opção ou o trecho"],["POST","/v1/aggregate","quantidades (AGG / AGID)"],["POST","/v1/tag","trechos e entidades"],["POST","/v1/decide","regras compostas → ações sugeridas"],["POST","/v1/document","documentos longos"],["POST","/v1/tools/<nome>","pii · mask · lang · validate · math · time"],["POST","/execute","qualquer consulta da linguagem"],["GET","/capabilities","o que o modelo sabe fazer"],["GET","/health","estado"]];
  const base=Object.entries(s.api||{});m.innerHTML=head("Cap. V — A API","Tudo, <span class='it'>localmente</span>.","Cada modelo carregado tem a API inteira do DJORGE nesta máquina. Autenticação: <code>Authorization: Bearer &lt;token&gt;</code> — o mesmo token do painel.")+
  `<div class="stats">${base.map(([k,u])=>`<div class="stat"><div class="big">${esc(k)}</div><div class="cap">${esc(u)}</div></div>`).join("")||`<div class="stat"><div class="big">—</div><div class="cap">nenhum modelo carregado</div></div>`}</div>
  <div class="ledger"><table><thead><tr><th>método</th><th>rota</th><th>o que faz</th></tr></thead><tbody>${eps.map(e=>`<tr><td><span class="mth ${e[0]=="GET"?"get":""}">${e[0]}</span></td><td class="m">${esc(e[1])}</td><td>${esc(e[2])}</td></tr>`).join("")}</tbody></table></div>
  <pre>curl ${esc((base[0]||["","http://127.0.0.1:8750"])[1])}/v1/classify \\
  -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \\
  -d '{"text":"O boleto vence amanhã","labels":["cobrança","entrega","outro"]}'</pre>
  <button class="btn btn-ghost" onclick="copyTok()">Copiar token</button>`}
 if(tab=="estado"){const s=await api("/api/status");const ms=s.model_state||{};
  m.innerHTML=head("Cap. VI — Por dentro","Estado do <span class='it'>sistema</span>.","")+
  `<div class="stats"><div class="stat"><div class="big">${s.loaded.length}</div><div class="cap">modelos prontos</div></div><div class="stat"><div class="big">${s.trees.length}</div><div class="cap">árvores</div></div><div class="stat"><div class="big">${Object.keys(s.connectors).length}</div><div class="cap">conectores ativos</div></div><div class="stat"><div class="big">${s.pending}</div><div class="cap">confirmações</div></div></div>
  <div class="grid"><article class="card"><h3>Modelos</h3>${Object.entries(s.models).map(([k,v])=>`<p class="text"><b>${esc(k)}</b> — ${esc(v.role)} <span class="chip ${ms[k]=="pronto"?"p":"soft"}">${esc(ms[k]||(v.enabled?"aguardando":"desligado"))}</span></p>`).join("")}</article>
  <article class="card"><h3>Conectores</h3>${Object.entries(s.connectors).map(([k,v])=>`<p class="text"><b>${esc(k)}</b> — ${esc(v)}</p>`).join("")||'<p class="text">Só a API local (ative outros no config.yaml).</p>'}</article></div>`}
 live()}
async function live(){try{const s=await api("/api/status");const ok=s.loaded.length>0;const l=$("live");l.classList.toggle("ok",ok);
  l.querySelector("span").textContent=ok?`${s.loaded.join(" · ")} · fila ${s.queue}`:(Object.values(s.model_state||{}).includes("carregando")?"carregando…":"sem modelo")}catch(e){}}
async function ok(id,a){await api("/api/pending/"+id,{approve:a});toast(a?"aprovado":"recusado");draw()}
async function ev(){const r=await api("/api/event",{sync:true,title:$("ti").value,text:$("tx").value,tree:$("tr").value||undefined,source:"teste"});
  $("out").innerHTML=`<article class="card" style="margin-top:22px"><h3>Caminho percorrido</h3>${trail(r)||'<p class="text">Nenhuma árvore casou com este evento.</p>'}<pre>${esc(JSON.stringify(r,null,1))}</pre></article>`}
async function dq(){const r=await api("/api/decide",{model:$("mo").value,query:$("q").value,text:$("tq").value});const x=r.result||{};
  $("out").innerHTML=`<article class="card" style="margin-top:22px"><div class="meta">resposta</div><h3 style="font-size:34px">${esc(x.answer??x.value??(x.selected||[]).join(", ")??r.error)}</h3>${pct(x.probability)}<pre>${esc(JSON.stringify(r,null,1))}</pre></article>`}
async function sv(){const r=await api("/api/trees",{yaml:$("ya").value});$("sm").textContent=r.error?r.error:`ok · ${r.trees} árvore(s)`;toast(r.error?"erro na árvore":"árvores salvas")}
async function copyTok(){try{const t=(await api("/api/token")).token;await navigator.clipboard.writeText(t);toast("token copiado")}catch(e){toast("token em ~/.djorge-local/token.txt")}}
window.addEventListener("hashchange",()=>{const k=location.hash.slice(1);if(T[k]&&k!=tab){tab=k;draw()}});
draw();setInterval(()=>{if(tab=="eventos"||tab=="pend")draw();else live()},4000);
</script></body></html>
