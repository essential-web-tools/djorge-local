<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Djorge Local</title>
<meta name="color-scheme" content="light dark">
<link rel="icon" type="image/svg+xml" href="/static/icon.svg">
<link rel="stylesheet" href="/static/app/app.css">
</head>
<body>
<a class="sr" href="#view">Pular para o conteúdo</a>
<div id="app" class="app">
  <aside class="side" aria-label="Navegação">
    <div class="side-top">
      <a class="brand" href="#inicio" aria-label="Djorge Local — início"><img src="/static/icon.svg" alt=""><span>Djorge <em>Local</em></span></a>
      <button class="iconbtn" id="collapse" aria-label="Recolher barra lateral" data-tip="Recolher" data-tip-pos="right"><svg class="i"><use href="#i-side"/></svg></button>
    </div>
    <div class="side-actions">
      <button class="newbtn" id="btn-new" aria-keyshortcuts="Control+N"><i class="plus"><svg class="i"><use href="#i-plus"/></svg></i><span>Novo</span></button>
      <button class="navitem" id="btn-search" aria-keyshortcuts="Control+K"><svg class="i"><use href="#i-search"/></svg><span>Buscar</span><kbd>Ctrl K</kbd></button>
    </div>
    <div class="side-scroll">
      <nav id="nav" aria-label="Visões"></nav>
      <div class="recents">
        <div class="side-sec">Recentes</div>
        <div id="recents"></div>
      </div>
    </div>
    <div class="side-foot">
      <div class="me" id="me" role="status"><div class="avatar">D<i id="me-dot"></i></div><div class="me-t"><b>Você</b><small id="me-st">conectando…</small></div></div>
      <button class="iconbtn extra" id="btn-int" aria-label="Integrações" data-tip="Integrações" data-tip-pos="top"><svg class="i"><use href="#i-plug"/></svg></button>
      <button class="iconbtn" id="btn-set" aria-label="Configurações" aria-keyshortcuts="Control+," data-tip="Configurações" data-tip-pos="top"><svg class="i"><use href="#i-gear"/></svg></button>
    </div>
  </aside>
  <main class="main">
    <div class="topright"><button class="mchip" id="mchip" data-s="ausente" aria-haspopup="dialog" aria-label="Modelo"></button></div>
    <section id="view" class="view" tabindex="-1" aria-live="polite"></section>
    <div class="composer-wrap">
      <div class="suggest" id="suggest" aria-label="Sugestões"></div>
      <form class="composer" id="composer" autocomplete="off">
        <div class="recbar" id="recbar" aria-live="polite"><span class="wave" id="wave"></span><span id="rect">gravando 0:00</span><span class="sp" style="flex:1"></span>
          <button type="button" class="btn sm ghost" id="rec-cancel">Descartar</button><button type="button" class="btn sm" id="rec-stop">Parar e usar</button></div>
        <div class="extra-in" id="extra-in"><input class="inp" id="in-from" placeholder="Remetente (opcional)" aria-label="Remetente"><input class="inp" id="in-subj" placeholder="Assunto (opcional)" aria-label="Assunto"></div>
        <label class="sr" for="in">Escreva um pedido</label>
        <textarea id="in" rows="1" placeholder="Peça algo ao Djorge… (ex.: reunião com Ana amanhã às 15h)"></textarea>
        <div class="ctools">
          <button type="button" class="iconbtn" id="btn-plus" aria-label="Atalhos e anexos" aria-haspopup="menu" data-tip="Atalhos" data-tip-pos="top"><svg class="i"><use href="#i-plus"/></svg></button>
          <button type="button" class="iconbtn mic" id="btn-mic" aria-label="Falar" aria-pressed="false" data-tip="Falar" data-tip-pos="top"><span class="lvl"></span><svg class="i"><use href="#i-mic"/></svg></button>
          <button type="button" class="modebtn" id="btn-mode" aria-haspopup="listbox" data-m="auto"><i class="md"></i><span>Automático</span><svg class="i sm"><use href="#i-down"/></svg></button>
          <span class="sp"></span>
          <button type="submit" class="send" id="send" aria-label="Enviar" disabled><svg class="i"><use href="#i-up"/></svg></button>
        </div>
      </form>
      <div class="cfoot"><span>Tudo roda neste computador.</span><span><kbd>Enter</kbd> envia · <kbd>Shift</kbd>+<kbd>Enter</kbd> quebra linha · <kbd>/</kbd> foca</span></div>
    </div>
  </main>
</div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="false" aria-labelledby="dr-title" aria-hidden="true"></aside>
<div class="toasts" id="toasts" role="region" aria-label="Avisos" aria-live="polite"></div>
