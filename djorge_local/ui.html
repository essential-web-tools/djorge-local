<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Djorge Local</title>
<meta name="color-scheme" content="light dark">
<link rel="icon" type="image/svg+xml" href="/static/icon.svg">
<link rel="stylesheet" href="/static/app/app.css">
</head>
<body>
<a class="sr" href="#view">Pular para o conteúdo</a>
<div id="app" class="app">
  <aside class="side" aria-label="Navegação">
    <div class="side-top">
      <a class="brand" href="#inicio" aria-label="Djorge Local — início"><img src="/static/icon.svg" alt=""><span>Djorge <em>Local</em></span></a>
      <button class="iconbtn" id="collapse" aria-label="Recolher barra lateral" data-tip="Recolher" data-tip-pos="right"><svg class="i"><use href="#i-side"/></svg></button>
    </div>
    <div class="side-actions">
      <button class="newbtn" id="btn-new" aria-keyshortcuts="Control+N"><i class="plus"><svg class="i"><use href="#i-plus"/></svg></i><span>Novo</span></button>
      <button class="navitem" id="btn-search" aria-keyshortcuts="Control+K"><svg class="i"><use href="#i-search"/></svg><span>Buscar</span><kbd>Ctrl K</kbd></button>
    </div>
    <div class="side-scroll">
      <nav id="nav" aria-label="Visões"></nav>
      <div class="recents">
        <div class="side-sec">Recentes</div>
        <div id="recents"></div>
      </div>
    </div>
    <div class="side-foot">
      <div class="me" id="me" role="status"><div class="avatar">D<i id="me-dot"></i></div><div class="me-t"><b>Você</b><small id="me-st">conectando…</small></div></div>
      <button class="iconbtn extra" id="btn-int" aria-label="Integrações" data-tip="Integrações" data-tip-pos="top"><svg class="i"><use href="#i-plug"/></svg></button>
      <button class="iconbtn" id="btn-set" aria-label="Configurações" aria-keyshortcuts="Control+," data-tip="Configurações" data-tip-pos="top"><svg class="i"><use href="#i-gear"/></svg></button>
    </div>
  </aside>
  <main class="main">
    <div class="topright"><button class="mchip" id="mchip" data-s="ausente" aria-haspopup="dialog" aria-label="Modelo"></button></div>
    <section id="view" class="view" tabindex="-1" aria-live="polite"></section>
    <div class="composer-wrap">
      <div class="suggest" id="suggest" aria-label="Sugestões"></div>
      <form class="composer" id="composer" autocomplete="off">
        <div class="recbar" id="recbar" aria-live="polite"><span class="wave" id="wave"></span><span id="rect">gravando 0:00</span><span class="sp" style="flex:1"></span>
          <button type="button" class="btn sm ghost" id="rec-cancel">Descartar</button><button type="button" class="btn sm" id="rec-stop">Parar e usar</button></div>
        <div class="extra-in" id="extra-in"><input class="inp" id="in-from" placeholder="Remetente (opcional)" aria-label="Remetente"><input class="inp" id="in-subj" placeholder="Assunto (opcional)" aria-label="Assunto"></div>
        <label class="sr" for="in">Escreva um pedido</label>
        <textarea id="in" rows="1" placeholder="Peça algo ao Djorge… (ex.: reunião com Ana amanhã às 15h)"></textarea>
        <div class="ctools">
          <button type="button" class="iconbtn" id="btn-plus" aria-label="Atalhos e anexos" aria-haspopup="menu" data-tip="Atalhos" data-tip-pos="top"><svg class="i"><use href="#i-plus"/></svg></button>
          <button type="button" class="iconbtn mic" id="btn-mic" aria-label="Falar" aria-pressed="false" data-tip="Falar" data-tip-pos="top"><span class="lvl"></span><svg class="i"><use href="#i-mic"/></svg></button>
          <button type="button" class="modebtn" id="btn-mode" aria-haspopup="listbox" data-m="auto"><i class="md"></i><span>Automático</span><svg class="i sm"><use href="#i-down"/></svg></button>
          <span class="sp"></span>
          <button type="submit" class="send" id="send" aria-label="Enviar" disabled><svg class="i"><use href="#i-up"/></svg></button>
        </div>
      </form>
      <div class="cfoot"><span>Tudo roda neste computador.</span><span><kbd>Enter</kbd> envia · <kbd>Shift</kbd>+<kbd>Enter</kbd> quebra linha · <kbd>/</kbd> foca</span></div>
    </div>
  </main>
</div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="false" aria-labelledby="dr-title" aria-hidden="true"></aside>
<div class="toasts" id="toasts" role="region" aria-label="Avisos" aria-live="polite"></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-side" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11 12 4l8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></symbol>
  <symbol id="i-board" viewBox="0 0 24 24"><rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="10" y="4" width="5" height="11" rx="1.5"/><rect x="17" y="4" width="4" height="7" rx="1.5"/></symbol>
  <symbol id="i-cal" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4.5 4.5L19 7"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><path d="m3.5 6 1 1 2-2M3.5 12l1 1 2-2M3.5 18l1 1 2-2"/></symbol>
  <symbol id="i-msg" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></symbol>
  <symbol id="i-tree" viewBox="0 0 24 24"><circle cx="12" cy="5" r="2.2"/><circle cx="6" cy="18" r="2.2"/><circle cx="18" cy="18" r="2.2"/><path d="M12 7.2v4M12 11.2 6 15.8M12 11.2l6 4.6"/></symbol>
  <symbol id="i-plug" viewBox="0 0 24 24"><path d="M9 3v5M15 3v5M6 8h12v3a6 6 0 0 1-12 0zM12 17v4"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></symbol>
  <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
  <symbol id="i-pin" viewBox="0 0 24 24"><path d="M9 4h6l-1 5 4 4H6l4-4zM12 13v8"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></symbol>
  <symbol id="i-calc" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 12h.01M12 12h.01M16 12h.01M8 16h.01M12 16h.01M16 16h.01"/></symbol>
  <symbol id="i-send" viewBox="0 0 24 24"><path d="M21 3 10 14M21 3l-7 18-4-7-7-4z"/></symbol>
  <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M6 18l2.5-2.5M15.5 8.5 18 6"/></symbol>
  <symbol id="i-dl" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3 5 6v6c0 4.5 3 7.5 7 9 4-1.5 7-4.5 7-9V6z"/></symbol>
  <symbol id="i-filter" viewBox="0 0 24 24"><path d="M4 5h16l-6 8v6l-4-2v-4z"/></symbol>
  <symbol id="i-sort" viewBox="0 0 24 24"><path d="M7 4v16M3 16l4 4 4-4M17 20V4M13 8l4-4 4 4"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/></symbol>
  <symbol id="i-hash" viewBox="0 0 24 24"><path d="M5 9h14M5 15h14M10 4 8 20M16 4l-2 16"/></symbol>
  <symbol id="i-sync" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14-5L4 8M4 4v4h4M4 13a8 8 0 0 0 14 5l2-2M20 20v-4h-4"/></symbol>

  <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4zM10 21h4"/></symbol>
  <symbol id="i-vol" viewBox="0 0 24 24"><path d="M4 10v4h4l5 4V6L8 10zM16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></symbol>
</svg>
<script src="/static/app/app.js" defer></script>
</body></html>
