# Djorge Local - configuração. Tudo que lê ou age fora do programa começa DESLIGADO.
device: auto            # auto | cpu | cuda
threads: 0              # 0 = todos os núcleos
timezone: America/Sao_Paulo
language: pt

models:                 # o Flash vem dentro do programa; adicione outros pela aba Modelos
  flash:
    enabled: true
    path: "@app/modelos/flash"
    role: "Origo Flash — rápido, leve, para qualquer computador"

server:
  host: 127.0.0.1       # só esta máquina
  port: 8765
  token: ""             # vazio = gera em ~/.djorge-local/token.txt

api:                    # API completa do DJORGE, uma porta por modelo (Bearer = token do painel)
  enabled: true
  host: 127.0.0.1
  ports: {flash: 8750}
  batch_window_ms: 8    # junta pedidos simultâneos numa passada
  rate_rps: 50
  rate_burst: 200
  max_body_mb: 2

connectors:
  http_inbox: {enabled: true}          # qualquer programa: POST /api/event
  notifications:                        # Windows (pede permissão), Linux (D-Bus), macOS (Acesso Total ao Disco)
    enabled: false
    apps_allow: []                      # ex.: ["WhatsApp", "Outlook"]; vazio = todos
    apps_deny: []
    poll_s: 2
  folder:
    enabled: false
    paths: []                           # ex.: ["~/Downloads", "~/Documentos/entrada"]
    patterns: ["*.txt", "*.md", "*.eml", "*.pdf", "*.docx", "*.png", "*.jpg"]
    poll_s: 3
    max_mb: 20
  clipboard: {enabled: false, poll_s: 1.5, min_chars: 8}
  imap:
    enabled: false
    host: ""            # ex.: imap.gmail.com (senha de app)
    port: 993
    user: ""
    password_env: DJORGE_IMAP_PASSWORD
    folder: INBOX
    poll_s: 60
  command:
    enabled: false
    jobs: []            # ex.: [{name: tarefas, argv: ["meu_cli", "listar"], every_s: 120}]
  stdin: {enabled: false}

extract:
  ocr: true             # imagens: pytesseract + Tesseract
  ocr_lang: por+eng
  audio: false          # faster-whisper
  whisper_model: small
  max_chars: 20000

actions:
  require_confirmation: [command, webhook, write_file]   # esperam aprovação no painel
  webhook_allow: []     # prefixos de URL permitidos
  command_allow: []     # nomes de programas permitidos
  write_dir: ~/.djorge-local/saidas
  notify: true

trees_file: arvores.yaml
history: {keep: 2000, store_text: true, mask_pii: true}
max_steps: 25
