name: build
on:
  push: {tags: ["v*"]}
  workflow_dispatch:
    inputs:
      version: {description: "versão para publicar como Release (ex.: 0.7.4); vazio = só gerar os arquivos", required: false, default: ""}
jobs:
  windows:
    runs-on: windows-latest
    env: {HAS_CERT: "${{ secrets.WIN_CERT_PFX_BASE64 != '' }}"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install --index-url https://download.pytorch.org/whl/cpu torch
      - run: pip install -r requirements.txt winsdk pystray keyring
      # bootloader compiled here (not the shared prebuilt one): far fewer antivirus false positives
      - run: pip install --no-binary pyinstaller pyinstaller
        env: {PYINSTALLER_COMPILE_BOOTLOADER: "1"}
      - run: python tools_fetch_images.py
      - run: python tools_make_vault.py
        env: {DJORGE_MODEL_KEY: "${{ secrets.DJORGE_MODEL_KEY }}"}
      - run: python -m PyInstaller djorge-local.spec --noconfirm
      - name: assinar (opcional, com certificado em WIN_CERT_PFX_BASE64 / WIN_CERT_PASSWORD)
        if: ${{ env.HAS_CERT == 'true' }}
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String("${{ secrets.WIN_CERT_PFX_BASE64 }}"))
          $st = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1
          & $st.FullName sign /f cert.pfx /p "${{ secrets.WIN_CERT_PASSWORD }}" /fd sha256 /tr http://timestamp.digicert.com /td sha256 "dist\Djorge Local\Djorge Local.exe"
      - run: Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile assets/MicrosoftEdgeWebview2Setup.exe
        shell: pwsh
      - run: choco install innosetup -y --no-progress
      - run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'
      - uses: actions/upload-artifact@v4
        with: {name: DjorgeLocal-Windows, path: Output/*.exe}
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install torch && pip install -r requirements.txt pystray keyring pyinstaller
      - run: python tools_fetch_images.py
      - run: python tools_make_vault.py
        env: {DJORGE_MODEL_KEY: "${{ secrets.DJORGE_MODEL_KEY }}"}
      - run: python -m PyInstaller djorge-local.spec --noconfirm
      - run: cd dist && zip -qry DjorgeLocal-macOS.zip "Djorge Local.app"
      - uses: actions/upload-artifact@v4
        with: {name: DjorgeLocal-macOS, path: dist/DjorgeLocal-macOS.zip}
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: sudo apt-get update && sudo apt-get install -y python3-tk libayatana-appindicator3-1 libxcb-cursor0 libegl1 || true
      - run: pip install --index-url https://download.pytorch.org/whl/cpu torch
      - run: pip install -r requirements.txt pystray keyring pyinstaller "pywebview[qt]" PyQt6-WebEngine
      - run: python tools_fetch_images.py
      - run: python tools_make_vault.py
        env: {DJORGE_MODEL_KEY: "${{ secrets.DJORGE_MODEL_KEY }}"}
      - run: python -m PyInstaller djorge-local.spec --noconfirm
      - run: cd dist && tar czf DjorgeLocal-Linux.tar.gz "Djorge Local"
      - uses: actions/upload-artifact@v4
        with: {name: DjorgeLocal-Linux, path: dist/DjorgeLocal-Linux.tar.gz}
  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/download-artifact@v4
        with: {path: out}
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version != '' && format('v{0}', inputs.version) || github.ref_name }}
          name: Djorge Local ${{ inputs.version != '' && inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          body: |
            Instale o arquivo do seu sistema:
            * **Windows:** `DjorgeLocal-Setup-*.exe`
            * **macOS:** `DjorgeLocal-macOS.zip` (abra com clique direito → Abrir na primeira vez)
            * **Linux:** `DjorgeLocal-Linux.tar.gz`
          files: |
            out/DjorgeLocal-Windows/*.exe
            out/DjorgeLocal-macOS/*.zip
            out/DjorgeLocal-Linux/*.tar.gz
